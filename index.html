<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/icon.png" />
        <link rel="stylesheet" href="/src/styles/style.less" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no"
        />
        <title>FPS OS</title>
    </head>
    <body>
        <!--Intro-->
        <h1 id="title"></h1>
        <h1 id="logo"></h1>
        <div id="spinner" class="spinner"></div>
        <code id="bootlog" tabindex="-1">
            <span id="bootlog-content"></span>
            <span id="blink">_</span>
        </code>

        <!--Misc-->
        <h1 id="vel">0.0</h1>
        <div id="context">
            <span id="ctx-name">-</span>
            <div id="ctx-buttons"></div>
        </div>
        <div id="audio"></div>

        <!--PC-->
        <h1 id="cross">+</h1>
        <h1 id="pc-info">Click to play</h1>
        <h1 id="literal-pc-info">Press ESC to exit PC</h1>
        <div id="screen" class="screen">
            <div id="navbar">
                <span id="oses">
                    Web OSes:
                    <button class="os" id="fps"></button>
                    <button class="os" id="tundra"></button>
                </span>
                <div id="spacer"></div>
                <input class="url" name="url" type="text" placeholder="Search Google or type a URL" autocomplete="off" autocorrect="off" spellcheck="false"></input>
                <span id="bookmarks">
                    Bookmarks:
                    <button class="os" id="google"></button>
                    <button class="os" id="threejs"></button>
                </span>
            </div>
            <div id="spinner-box"><div class="spinner"></div></div>
            <div id="iframe-error">Sorry, that website isn't supported.</div>
        </div>

        <!--Mobile-->
        <div id="mobile">
            <div id="joystick-cont">
                <div id="joystick-pos">
                    <div id="joystick"></div>
                    <div id="joystick2"></div>
                    <div id="joystick3"></div>
                </div>
            </div>
            <div id="jump"></div>
            <div id="crouch"></div>
        </div>

        <!--Script-->
        <script type="module" src="/src/scripts/main.ts"></script>

        <!--Instances-->
    </body>
</html>
